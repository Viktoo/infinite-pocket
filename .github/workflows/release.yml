# A release: push a tag vX.Y.Z (matching Cargo.toml's version) and this
# builds Infinite Pocket for Apple Silicon Macs, attaches it to a GitHub
# release of that tag, and points `brew install viktoo/tap/pocket` at it.
# A Windows build (beta, untested) is attached too when it builds.
# See docs/releases.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs reads the commit and the tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag is Cargo.toml's version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml says $v, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      # (The tests ran before the tag: see docs/releases.md.)
      - name: Build
        run: cargo build --release
      - name: The build knows it is this release
        run: |
          got=$(./target/release/pocket version)
          if [ "v$got" != "$GITHUB_REF_NAME" ]; then
            echo "the build says $got, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Bundle
        run: sh scripts/bundle-macos.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Infinite Pocket for Macs with Apple Silicon.** Install it with Homebrew, then run `pocket`:

          ```
          brew install viktoo/tap/pocket
          ```

          Or unzip the app and move Infinite Pocket to Applications. It isn't signed yet, so the first time macOS won't open it: open System Settings → Privacy & Security and click Open Anyway.

          **Windows (beta, untested):** unzip `pocket-<version>-windows-x64.zip` and run `pocket.exe`. If Windows says it protected your PC, click More info → Run anyway. It's attached a little after the Mac files, if it built.

          Playing together needs everyone on this same release.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/pocket-*.tar.gz --title "Infinite Pocket ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
      # Needs a TAP_TOKEN secret: a token that can push to Viktoo/homebrew-tap.
      - name: Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "no TAP_TOKEN secret: the tap is not updated"
            exit 0
          fi
          v=${GITHUB_REF_NAME#v}
          sha=$(shasum -a 256 dist/pocket-$v-macos-arm64.tar.gz | cut -d' ' -f1)
          bottle_sha=$(shasum -a 256 dist/pocket-$v.all.bottle.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/Viktoo/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh scripts/homebrew-formula.sh "$v" "$sha" "$bottle_sha" > tap/Formula/pocket.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pocket.rb
          git commit -m "pocket $v"
          git push

  # Beta: nobody has played it on Windows yet. Built beside the Mac one;
  # when it fails, the Mac release goes out without it.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: The build knows it is this release
        run: |
          got=$(./target/release/pocket.exe version)
          if [ "v$got" != "$GITHUB_REF_NAME" ]; then
            echo "the build says $got, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Zip
        run: |
          mkdir dist
          7z a "dist/pocket-${GITHUB_REF_NAME#v}-windows-x64.zip" ./target/release/pocket.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  windows-release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pocket-*-windows-x64.zip --repo "$GITHUB_REPOSITORY"
